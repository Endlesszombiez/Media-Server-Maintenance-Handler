[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-folder-repair"
version = "0.1.0"
description = "Terminal app for repairing media folder names with LM Studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "textual>=0.79",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[project.scripts]
media-sm = "media_folder_repair.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
